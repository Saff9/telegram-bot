version: '3.8'

services:
  # The Ultra Bot service
  bot:
    build: .
    container_name: ultra_yt_bot
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - TELEGRAM_API_BASE_URL=http://local-bot-api:8081
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      - local-bot-api
    # Optimize for performance
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # The Local Bot API server (Required for very large files / 2-hour videos)
  local-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: local_bot_api
    environment:
      - TELEGRAM_API_ID=${API_ID}
      - TELEGRAM_API_HASH=${API_HASH}
    command:
      - "--local"
      - "--api-id=${API_ID}"
      - "--api-hash=${API_HASH}"
      - "--dir=/var/lib/telegram-bot-api"
      - "--temp-dir=/tmp/telegram-bot-api"
      - "--http-port=8081"
      - "--stats-port=8082"
    volumes:
      - ./local-bot-api-data:/var/lib/telegram-bot-api
    restart: always
    ports:
      - "8082:8082"
